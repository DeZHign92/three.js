<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - Enhanced Animation Scene</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        a {
            color: lightblue;
        }
        .control-inactive button {
            color: #888;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Creative Skeletal Animation Scene<br>
        (model from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>)
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, renderer, camera, stats;
        let model, mixer, clock, spotlight;
        const actions = {};
        const panelSettings = {};
        let activeAction = 'idle';

        init();

        function init() {
            const container = document.getElementById('container');
            clock = new THREE.Clock();

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // Environment map
            const cubeTextureLoader = new THREE.CubeTextureLoader();
            const envMap = cubeTextureLoader.load([
                'textures/px.jpg', 'textures/nx.jpg',
                'textures/py.jpg', 'textures/ny.jpg',
                'textures/pz.jpg', 'textures/nz.jpg'
            ]);
            scene.environment = envMap;

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(-2, 2, 5);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            spotlight = new THREE.SpotLight(0xffcc99, 2, 50, Math.PI / 6, 0.5);
            spotlight.position.set(5, 10, 5);
            spotlight.castShadow = true;
            scene.add(spotlight);

            // Ground plane
            const groundTexture = new THREE.TextureLoader().load('textures/ground.jpg');
            groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
            groundTexture.repeat.set(10, 10);

            const groundMaterial = new THREE.MeshStandardMaterial({ map: groundTexture });
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Model loader
            const loader = new GLTFLoader();
            loader.load('models/gltf/Xbot.glb', function (gltf) {
                model = gltf.scene;
                scene.add(model);

                model.traverse(function (object) {
                    if (object.isMesh) object.castShadow = true;
                });

                mixer = new THREE.AnimationMixer(model);

                gltf.animations.forEach((clip) => {
                    const action = mixer.clipAction(clip);
                    actions[clip.name] = action;
                    if (clip.name === activeAction) {
                        action.play();
                    }
                });

                createGUI();
            });

            // Orbit controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1, 0);
            controls.update();

            // Stats panel
            stats = new Stats();
            container.appendChild(stats.dom);

            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createGUI() {
            const gui = new GUI();

            gui.add(panelSettings, 'Active Action', Object.keys(actions)).onChange((name) => {
                fadeToAction(name, 0.5);
            });

            const lightFolder = gui.addFolder('Spotlight');
            lightFolder.addColor(new THREE.Color(), 'setHex').name('Color').onChange((color) => {
                spotlight.color.set(color);
            });
            lightFolder.add(spotlight, 'intensity', 0, 5, 0.1);
            lightFolder.open();
        }

        function fadeToAction(name, duration) {
            const prevAction = actions[activeAction];
            const nextAction = actions[name];
            if (prevAction !== nextAction) {
                prevAction.fadeOut(duration);
                nextAction.reset().fadeIn(duration).play();
                activeAction = name;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            spotlight.position.x = Math.sin(clock.elapsedTime) * 5;
            spotlight.position.z = Math.cos(clock.elapsedTime) * 5;

            renderer.render(scene, camera);
            stats.update();
            requestAnimationFrame(animate);
        }

    </script>
</body>
</html>
